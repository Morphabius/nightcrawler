<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <h1>BAMF!</h1>
        <div class="controls-hint">
            <strong>Mover:</strong> Setas | 
            <strong>Pular:</strong> D | 
            <strong>Ataque:</strong> S (Espaço) | 
            <strong>BAMF:</strong> A
        </div>
        <div class="controls-hint secondary">Tente: <strong>D+D</strong> (Pulo Duplo) | <strong>Baixo+S</strong> (Ground Kick) | <strong>Trás+D</strong> (Evasão)</div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
