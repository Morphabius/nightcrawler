<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Platformer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <h1>BAMF!</h1>
        <div class="controls-hint">
            <strong>Mover:</strong> Setas <br>
            <strong>Pular:</strong> D <br>
            <strong>Ataque:</strong> S (Espaço) <br>
            <strong>BAMF:</strong> A
        </div>
        <div class="controls-hint secondary">MANOBRAS: <br>
            <strong> Cima + S</strong> (Soco acima)<br>
            <strong> Baixo + S</strong> (Soco baixo)<br>
            <strong>Trás + D</strong> (Evasão com chute) <br>
            <strong>D+D</strong> (Pulo Duplo) <br>
            <br>
            <strong>Durante o pulo: </strong><br>
            <strong> Baixo + S</strong> (Ataque descendente) <br>
            </strong> Diagonal para Baixo + S </strong> (Chute Diagonal) <br>
        </div>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
